<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="115" viewBox="0 0 1100 115" role="img" aria-labelledby="footer-title footer-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
